# 名称
name: 部署文档

# 触发条件：main 分支上 docs 或组件库有变更时，或手动触发
# 组件库也要触发：文档里的示例渲染的是真实组件，库改了文档产物就变了
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ui/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# 同一分支上新推送取消尚未完成的旧运行
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# 任务
jobs:
  deploy-gh-pages:
    # 服务器环境：最新版 Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs/

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 文档站以 link: 引用 ui/packages/adapters/vue 与 ui/packages/design/styles，示例要渲染就得先有 dist
      - name: 安装组件库依赖
        working-directory: ./ui/
        run: pnpm install --frozen-lockfile

      - name: 构建组件库
        working-directory: ./ui/
        run: pnpm build

      # docs/pnpm-lock.yaml 在 .gitignore 里，检出后没有这份文件，装依赖不能用 --frozen-lockfile
      - name: 安装依赖
        run: pnpm install

      - name: 构建文档
        run: pnpm run build

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 这是文档部署到的分支名称
          branch: gh-pages
          folder: ./docs/.vitepress/dist
