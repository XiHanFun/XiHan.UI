name: Release

# 只做一件事：把当前提交里的包发到 npm。
# 版本号、CHANGELOG、git tag、GitHub Release 全部由人手工完成。
# 门禁、测试、publint / attw 全在 ci.yml：标签指向的提交进 main 时 CI 已经跑过一遍，
# 这里不再重复；发布链上只留发包本身绕不开的步骤。
#
# 发包必须同时满足两条，由 guard job 把关，缺一不发：
# ① 标签指向的提交在 main 的历史里。标签本身不带分支信息，所以要查祖先关系——
#    打在 dev 或任何别处的 v* 标签一律拒发。
# ② 标签号就是包里写着的版本号，且与 changesets 的 pre 模式对得上——
#    否则发出去的不是你以为的那个版本。
# 手动 Run workflow 时必须选中一个版本标签；选分支会被 ① 拦下。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    working-directory: ui

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 要拿完整历史才能判断祖先关系
          fetch-depth: 0
      - name: 只放行 main 上的版本标签
        working-directory: .
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release 只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 的历史里，拒绝发布。请先把要发布的提交合进 main，再在 main 上打标签。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 在 main 上，放行"
      # 对账脚本只用 node 内建模块，不装依赖
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 标签号与包版本、预发布模式对账
        run: node tooling/scripts/check-release-tag.mjs

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # 发出去的是 dist，没有构建就没有可发的东西
      - name: Build
        run: pnpm build
      # changeset publish 只发 npm 上还没有的版本，已发布的包跳过
      - name: Publish to npm
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
