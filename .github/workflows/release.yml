name: Release

# 只做一件事：把当前提交里的包发到 npm。
# 版本号、CHANGELOG、git tag、GitHub Release 全部由人手工完成。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    working-directory: ui

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # 发布前自己再验一遍产物契约：CI 那条链跑在 PR 与 push 上，与「这一刻要发出去的
      # 这份产物」不是同一次构建。publint 与 attw 只在包已构建时才有意义，所以先 build
      - name: Build
        run: pnpm build
      - name: Publish artifacts (publint + attw)
        run: pnpm gate:publish
      # changeset publish 只发 npm 上还没有的版本，已发布的包跳过
      - name: Publish to npm
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
