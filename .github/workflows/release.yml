name: Release

# 只做一件事：把当前提交里的包发到 npm。
# 版本号、CHANGELOG、git tag、GitHub Release 全部由人手工完成。
#
# 只有 main 上的版本标签能发包。标签本身不带分支信息，所以由 guard job 验证
# 被标记的提交确实在 main 的历史里——打在 dev 或任何别处的 v* 标签一律拒发。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency: ${{ github.workflow }}-${{ github.ref }}

defaults:
  run:
    working-directory: ui

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # 要拿完整历史才能判断祖先关系
          fetch-depth: 0
      - name: 只放行 main 上的版本标签
        working-directory: .
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Release 只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 的历史里，拒绝发布。请先把要发布的提交合进 main，再在 main 上打标签。"
            exit 1
          fi
          echo "标签 $GITHUB_REF_NAME 在 main 上，放行"

  publish:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # 发布前自己再验一遍产物契约：CI 那条链跑在 PR 与 push 上，与「这一刻要发出去的
      # 这份产物」不是同一次构建。publint 与 attw 只在包已构建时才有意义，所以先 build
      - name: Build
        run: pnpm build
      # 标签写的版本号必须与 changesets 的 pre 模式对得上，否则发出去的不是你以为的那个版本
      - name: 标签与预发布模式对账
        run: pnpm exec node tooling/scripts/check-release-tag.mjs
      - name: Publish artifacts (publint + attw)
        run: pnpm gate:publish
      # changeset publish 只发 npm 上还没有的版本，已发布的包跳过
      - name: Publish to npm
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
