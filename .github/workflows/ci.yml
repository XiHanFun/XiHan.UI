name: CI

on:
  push:
    branches: [dev, preview, main]
  pull_request:
    branches: [dev, preview, main]

# 同一分支连着推时只留最新的一次：dev 几分钟一推，旧提交那一轮跑完也不再有人看。
# main 与 preview 不取消——进来的每个提交都要跑出完整结论，发版时以它为据。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/preview' }}

defaults:
  run:
    working-directory: ui

# 分组的出发点：整轮的墙钟时间由最长的那一个 job 决定，所以按「吃不吃构建产物、要不要浏览器」
# 拆成互不等待的 job，最慢的单测与浏览器用例再按包、按分片铺开。每个 job 自己装依赖、自己构建，
# 互相不传产物——全量构建不到一分钟，另起一个构建 job 再传产物反而让所有下游多等它一轮。
#
# 两条约束：
#   · 同时在跑的 job 不超过 20。超过账户的并发上限后多出来的 job 要排队等空位，排到哪一个不由我们定，
#     排到最长的那个时整轮就多等一截。加分片前先数一遍。判改动范围的 changes 跑完单测与浏览器态才开始，
#     不与它们同时占位，所以不计在内。
#   · 同一个 job 里互不依赖的检查都带 `if: !cancelled()`：前一步红了后面的照跑，一轮看全所有的红，
#     不必修一处推一次才露出下一处。真有先后依赖的（吃构建产物的、吃文档站产物的）另按那一步的结果判。
jobs:
  # 改动全落在 Markdown 正文上时，单测、浏览器态与浏览器附加项三组不跑：正文碰不到它们读的任何东西。
  # 其余 job 照跑。判据与例外（生成的组件页、测试夹具不算正文；取不到比较基点时跑全套）见脚本头注释。
  # 只看提交树，不取文件内容，所以拉全历史时不带 blob。
  changes:
    name: 改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: 改动是不是全是 Markdown 正文
        id: scope
        run: node tooling/scripts/ci-changes.mjs --base=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }} --head=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  # 不吃构建产物的静态门禁
  lint:
    name: 静态门禁与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Gate (依赖 / 令牌 / 浮层 / 皮肤 / 部件接线 / 导出 / 角色组)
        run: pnpm gate
      - name: Token artifacts in sync
        if: ${{ !cancelled() }}
        run: pnpm gate:tokens
      - name: Custom elements manifest in sync
        if: ${{ !cancelled() }}
        run: pnpm gate:cem
      - name: Unlayered skin in sync
        if: ${{ !cancelled() }}
        run: pnpm gate:styled
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Commit message
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  # 类型检查单占一台：它是不碰浏览器的 job 里最长的一步，和下面吃产物的那一串挤在一起时
  # 后者要等它跑完才开始，两段串成全轮最长的非浏览器 job。
  typecheck:
    name: 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Typecheck
        run: pnpm typecheck

  artifacts:
    name: 构建与产物
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Build
        id: build
        run: pnpm build
      # 下面几步都吃构建产物，构建成功才跑，彼此之间互不依赖：
      # 组件文档由 headless 产物与类型生成；React 示例的类型判据要读 icons 的 dist（它没有
      # TS 源码）；公开面从各包已构建的 .d.ts 采集（产物才是使用者拿到的那一份）；
      # dependency-cruiser 按 exports 条件解析兄弟包，同样指向 dist。
      - name: Component docs in sync
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:docs
      - name: React demo types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:demo-types
      - name: Public surface baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:surface
      - name: Boundaries (dependency-cruiser)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm boundaries
      - name: Size limit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm size
      # cjs-resolves-to-esm 是 ESM-only 的刻意选择，node10 / node16-from-ESM / bundler 三列均绿
      - name: 子路径导出与 dist 对得上
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:exports
      - name: Publish artifacts (publint + attw)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:publish

  # 文档站是全仓唯一会编译 .vue 示例的地方，也是站内死链唯一的判据（没配 ignoreDeadLinks，
  # 断一条就构建失败）；渲染期抛的异常由 .vitepress/config.ts 的 buildEnd 收口成非零退出。
  # 它以 link: 吃 ui 的 dist，所以先构建 ui。文档站独立锁文件随仓库提交，本地与 CI 均按锁文件安装。
  #
  # Nuxt 示例并在这一个 job 里：两边都只要 ui 的构建产物、都不碰浏览器，各自只有几十秒到一两分钟，
  # 单开一台 runner 时装依赖加构建的固定开销比它自己还长。
  # 示例（仓库根 examples/nuxt）在系统临时目录里装：Nuxt 不进 ui 的依赖与锁文件。
  # 它对着本仓刚打出的包装（pnpm pack 把 workspace: 换成真实版本，与发到 npm 的那一份同形），
  # 只靠 modules: ['@xihan-ui/vue/nuxt'] 接上，类型检查、构建后起服务检查首屏。
  docs:
    name: 文档站与 Nuxt 示例
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Build
        id: build
        run: pnpm build
      - name: 装文档站依赖
        id: docs-install
        working-directory: ./docs
        run: pnpm install --frozen-lockfile
      - name: 文档站 Lint
        if: ${{ !cancelled() && steps.docs-install.outcome == 'success' }}
        working-directory: ./docs
        run: pnpm lint
      - name: 构建文档站（编译 .vue 示例 + 站内死链）
        id: docs-build
        if: ${{ !cancelled() && steps.docs-install.outcome == 'success' }}
        working-directory: ./docs
        run: pnpm build
      # 机读资产由文档站构建期落盘，文档站构建成功才有东西可对
      - name: 机读资产与库对账
        if: ${{ !cancelled() && steps.docs-build.outcome == 'success' }}
        run: pnpm gate:llms
      - name: 装进 Nuxt 示例，类型检查、构建并检查首屏
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm gate:nuxt

  # 单测按包分组，各占一台 runner。四个大包各占一组、各开四个 worker 占满四核；
  # 两个包挤一台时 turbo 让它们并行，每包只分得到两个 worker，那一组就成了单测里最长的。
  unit:
    name: 单测（${{ matrix.name }}）
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vue
            filter: '--filter=@xihan-ui/vue'
            workers: 4
          - name: headless
            filter: '--filter=@xihan-ui/headless'
            workers: 4
          - name: react
            filter: '--filter=@xihan-ui/react'
            workers: 4
          - name: web-components
            filter: '--filter=@xihan-ui/web-components'
            workers: 4
          # 其余全部包用排除写法：以后新增的包自动落进这一组，不会漏测。
          # 上面加一组时，这里要同步排除它，否则那几个包会跑两遍（多跑，不会漏）。
          - name: 其余包
            filter: '--filter=!@xihan-ui/vue --filter=!@xihan-ui/headless --filter=!@xihan-ui/react --filter=!@xihan-ui/web-components'
            workers: 2
    env:
      VITEST_MAX_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      # 用例默认 5s 超时是按开发机定的。CI 上几个包并发跑时，CPU 争抢下纯计算的用例
      # 慢十几倍，本机一秒多的会假超时。超时是护栏不是断言，放到 60s。
      # 直接调运行器而不走 pnpm test：--filter 写在 pnpm 后面会被 pnpm 当成自己的选项。
      - name: Test
        run: node tooling/scripts/test-unit.mjs ${{ matrix.filter }} -- --testTimeout=60000

  # 单开一组：真实浏览器要下 ~300MB 的 Chromium，不该把上面那几条快链路堵住。
  # 三端的全量无障碍扫描是各包最重的一块（每端两份文件、单份约三分钟），在浏览器配置里单成 *-a11y 项目，
  # 这里每端独占一片（--project=*-a11y*）；其余用例用 --project=!*-a11y* 排除它们，vue 再按 vitest --shard 切五片
  # （按文件路径哈希切连续区间，各片合起来不重不漏），react 一片，web-components 与 position 合一片。
  # test-browser.mjs 逐包串行跑：react 与 web-components 各要三四分钟，合在一片里就是全轮最长的 job，所以分开。
  # 以后新增的项目名不带 -a11y 就自动落进常规分片，不会漏跑。
  browser:
    name: 浏览器态（${{ matrix.name }}）
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vue 1/5, id: vue-1, args: '--pkg=vue -- "--project=!*-a11y*" --shard=1/5' }
          - { name: vue 2/5, id: vue-2, args: '--pkg=vue -- "--project=!*-a11y*" --shard=2/5' }
          - { name: vue 3/5, id: vue-3, args: '--pkg=vue -- "--project=!*-a11y*" --shard=3/5' }
          - { name: vue 4/5, id: vue-4, args: '--pkg=vue -- "--project=!*-a11y*" --shard=4/5' }
          - { name: vue 5/5, id: vue-5, args: '--pkg=vue -- "--project=!*-a11y*" --shard=5/5' }
          - { name: react, id: react, args: '--pkg=react -- "--project=!*-a11y*"' }
          - { name: web-components + position, id: wc, args: '--pkg=web-components,position -- "--project=!*-a11y*"' }
          - { name: vue 无障碍, id: vue-a11y, args: '--pkg=vue -- "--project=*-a11y*"' }
          - { name: react 无障碍, id: react-a11y, args: '--pkg=react -- "--project=*-a11y*"' }
          - { name: web-components 无障碍, id: wc-a11y, args: '--pkg=web-components -- "--project=*-a11y*"' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --fail-if-no-match --filter @xihan-ui/vue exec playwright install --with-deps chromium
      # 全库 53 处皮肤写 font-family: inherit，字体最终取文档根上的那一个，而截图用例把根上的
      # 字体族按名字写死成 DejaVu Sans。这个名字在 runner 上解析不到时会静默回落成别的字体，
      # 每个字形的栅格化结果都变，截图用例整体判红。这一步把那个名字装上。
      # 核对的是这个名字本身，不是默认 sans-serif——上一步的 --with-deps 会带进一批字体，
      # 默认 sans-serif 因此可能落到 Noto Sans 上，而画面一个像素都不变。
      - name: Install baseline font (DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core && fc-match 'DejaVu Sans'
      - name: Build
        run: pnpm build
      - name: Accessibility + visual baselines (real Chromium)
        run: pnpm test:browser ${{ matrix.args }}
      # 基线对不上时把实际截图与差异图带出来：像素差异在日志里看不出来，
      # 必须下载下来逐张比对，确认是有意的视觉改动才重出基线。
      # artifact 名按分片区分：同一轮里重名的 artifact 会让后传的那片上传失败。
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diffs-${{ matrix.id }}
          path: ui/packages/adapters/*/.vitest-attachments/**
          # 落点是点开头的目录，upload-artifact 默认跳过隐藏文件，不开这个开关会报
          # 「No files were found」而一张图都不带出来
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-extras:
    name: 性能预算与自定义元素示例
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --fail-if-no-match --filter @xihan-ui/vue exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # 示例文件在 docs/ 下，不在 turbo 对 test:browser 声明的输入集里，单开一步直接起 vitest
      - name: Web Components demos (real Chromium)
        run: pnpm gate:demos
      # 性能预算与像素基线共用 Playwright Linux 镜像，但额外固定 2 CPU / 2 GiB、
      # 800×520@1x 与 4× CPU throttle；宿主 runner 的瞬时规格不直接成为判据。
      - name: Pull visual performance image
        run: docker pull mcr.microsoft.com/playwright:v1.62.0-noble
      - name: Visual performance budget (default vs reduced transparency)
        run: pnpm visual:performance
