name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

defaults:
  run:
    working-directory: ui

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gate (依赖 / 令牌 / 浮层 / 皮肤 / 部件接线 / 导出 / 角色组)
        run: pnpm gate
      - name: Token artifacts in sync
        run: pnpm gate:tokens
      - name: Custom elements manifest in sync
        run: pnpm gate:cem
      - name: Unlayered skin in sync
        run: pnpm gate:styled
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # 下面三步都吃构建产物，必须排在 Build 之后：
      # 组件文档由 headless 产物与类型生成；公开面从各包已构建的 .d.ts 采集（产物才是
      # 使用者拿到的那一份）；dependency-cruiser 按 exports 条件解析兄弟包，同样指向 dist。
      - name: Component docs in sync
        run: pnpm gate:docs
      - name: Public surface baseline
        run: pnpm gate:surface
      - name: Boundaries (dependency-cruiser)
        run: pnpm boundaries
      # 用例默认 5s 超时是按开发机定的。这一步并发跑二十多个包，CPU 争抢下纯计算的用例
      # 慢十几倍，本机一秒多的会假超时。超时是护栏不是断言，放到 60s。
      - name: Test
        run: pnpm test -- --testTimeout=60000
      - name: Size limit
        run: pnpm size
      # cjs-resolves-to-esm 是 ESM-only 的刻意选择，node10 / node16-from-ESM / bundler 三列均绿
      - name: 子路径导出与 dist 对得上
        run: pnpm gate:exports
      - name: Publish artifacts (publint + attw)
        run: pnpm gate:publish
      - name: Commit message
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  # 单开一份：真实浏览器要下 ~300MB 的 Chromium，不该把上面那条快链路堵住
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --fail-if-no-match --filter @xihan-ui/vue exec playwright install --with-deps chromium
      # 全库 53 处皮肤写 font-family: inherit，字体最终取文档根上的那一个，而截图用例把根上的
      # 字体族按名字写死成 DejaVu Sans。这个名字在 runner 上解析不到时会静默回落成别的字体，
      # 每个字形的栅格化结果都变，截图用例整体判红。这一步把那个名字装上。
      # 核对的是这个名字本身，不是默认 sans-serif——上一步的 --with-deps 会带进一批字体，
      # 默认 sans-serif 因此可能落到 Noto Sans 上，而画面一个像素都不变。
      - name: Install baseline font (DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core && fc-match 'DejaVu Sans'
      - name: Build
        run: pnpm build
      - name: Accessibility + visual baselines (real Chromium)
        run: pnpm test:browser
      # 基线对不上时把实际截图与差异图带出来：像素差异在日志里看不出来，
      # 必须下载下来逐张比对，确认是有意的视觉改动才重出基线。
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diffs
          path: ui/packages/adapters/*/.vitest-attachments/**
          if-no-files-found: ignore
          retention-days: 7
      # 示例文件在 docs/ 下，不在 turbo 对 test:browser 声明的输入集里，单开一步直接起 vitest
      - name: Web Components demos (real Chromium)
        run: pnpm gate:demos
