name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

defaults:
  run:
    working-directory: ui

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gate (运行时依赖 / 版本锁 / 令牌产物 / 浮层 / 皮肤 / 部件接线)
        run: pnpm gate
      - name: Token artifacts in sync
        run: pnpm gate:tokens
      - name: Custom elements manifest in sync
        run: pnpm gate:cem
      - name: Unlayered skin in sync
        run: pnpm gate:styled
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Boundaries (dependency-cruiser)
        run: pnpm boundaries
      - name: Build
        run: pnpm build
      # 组件文档由 headless 产物与类型生成，必须排在 Build 之后
      - name: Component docs in sync
        run: pnpm gate:docs
      - name: Test
        run: pnpm test
      - name: Size limit
        run: pnpm size
      # cjs-resolves-to-esm 是 ESM-only 的刻意选择，node10 / node16-from-ESM / bundler 三列均绿
      - name: Publish artifacts (publint + attw)
        run: pnpm gate:publish
      - name: Commit message
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  # 单开一份：真实浏览器要下 ~300MB 的 Chromium，不该把上面那条快链路堵住
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 仓库根没有 package.json，action 默认在根找 packageManager 会失败；
      # 指向工作区的清单，pnpm 版本仍以 ui/package.json 为唯一事实源
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @xihan-ui/vue exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      - name: Accessibility (real Chromium)
        run: pnpm test:browser
