name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# 同一分支连着推时只留最新的一次：dev 几分钟一推，旧提交那一轮跑完也不再有人看。
# main 不取消——进 main 的每个提交都要跑出完整结论，发版时以它为据。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ui

# 原先是两条长链：quality 约 21 分钟、browser 约 34 分钟，各在一台 4 核 runner 上串行跑完。
# 现在按「吃不吃构建产物、要不要浏览器」拆成互不等待的 job，最慢的单测与浏览器用例再按包、按分片铺开，
# 整轮的墙钟时间由最长的那一个 job 决定。每个 job 自己装依赖、自己构建，互相不传产物。
jobs:
  # 不吃构建产物的静态门禁
  lint:
    name: 静态门禁与 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Gate (依赖 / 令牌 / 浮层 / 皮肤 / 部件接线 / 导出 / 角色组)
        run: pnpm gate
      - name: Token artifacts in sync
        run: pnpm gate:tokens
      - name: Custom elements manifest in sync
        run: pnpm gate:cem
      - name: Unlayered skin in sync
        run: pnpm gate:styled
      - name: Lint
        run: pnpm lint
      - name: Commit message
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from origin/${{ github.base_ref }} --to HEAD

  quality:
    name: 类型、构建与产物
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # 下面几步都吃构建产物，必须排在 Build 之后：
      # 组件文档由 headless 产物与类型生成；React 示例的类型判据要读 icons 的 dist（它没有
      # TS 源码）；公开面从各包已构建的 .d.ts 采集（产物才是使用者拿到的那一份）；
      # dependency-cruiser 按 exports 条件解析兄弟包，同样指向 dist。
      - name: Component docs in sync
        run: pnpm gate:docs
      - name: React demo types
        run: pnpm gate:demo-types
      - name: Public surface baseline
        run: pnpm gate:surface
      - name: Boundaries (dependency-cruiser)
        run: pnpm boundaries
      - name: Size limit
        run: pnpm size
      # cjs-resolves-to-esm 是 ESM-only 的刻意选择，node10 / node16-from-ESM / bundler 三列均绿
      - name: 子路径导出与 dist 对得上
        run: pnpm gate:exports
      - name: Publish artifacts (publint + attw)
        run: pnpm gate:publish

  # 文档站是全仓唯一会编译 .vue 示例的地方，也是站内死链唯一的判据（没配 ignoreDeadLinks，
  # 断一条就构建失败）；渲染期抛的异常由 .vitepress/config.ts 的 buildEnd 收口成非零退出。
  # 它以 link: 吃 ui 的 dist，所以先构建 ui。文档站独立锁文件随仓库提交，本地与 CI 均按锁文件安装。
  docs:
    name: 文档站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Build
        run: pnpm build
      - name: 装文档站依赖
        working-directory: ./docs
        run: pnpm install --frozen-lockfile
      - name: 文档站 Lint
        working-directory: ./docs
        run: pnpm lint
      - name: 构建文档站（编译 .vue 示例 + 站内死链）
        working-directory: ./docs
        run: pnpm build
      # 机读资产由文档站构建期落盘，必须排在上一步之后
      - name: 机读资产与库对账
        run: pnpm gate:llms

  # 单测按包分组，各占一台 runner。四个大包单跑一个要六到八分钟（一个 worker 时），
  # 挤在一台 4 核机器上时 test-unit.mjs 只能给每包一个 worker；拆开后一组只有一两个包，
  # worker 数按组里的包数放宽到占满四核。
  unit:
    name: 单测（${{ matrix.name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vue
            filter: '--filter=@xihan-ui/vue'
            workers: 4
          - name: headless
            filter: '--filter=@xihan-ui/headless'
            workers: 4
          - name: react + web-components
            filter: '--filter=@xihan-ui/react --filter=@xihan-ui/web-components'
            workers: 2
          # 其余全部包用排除写法：以后新增的包自动落进这一组，不会漏测。
          # 上面加一组时，这里要同步排除它，否则那几个包会跑两遍（多跑，不会漏）。
          - name: 其余包
            filter: '--filter=!@xihan-ui/vue --filter=!@xihan-ui/headless --filter=!@xihan-ui/react --filter=!@xihan-ui/web-components'
            workers: 2
    env:
      VITEST_MAX_WORKERS: ${{ matrix.workers }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      # 用例默认 5s 超时是按开发机定的。CI 上几个包并发跑时，CPU 争抢下纯计算的用例
      # 慢十几倍，本机一秒多的会假超时。超时是护栏不是断言，放到 60s。
      # 直接调运行器而不走 pnpm test：--filter 写在 pnpm 后面会被 pnpm 当成自己的选项。
      - name: Test
        run: node tooling/scripts/test-unit.mjs ${{ matrix.filter }} -- --testTimeout=60000

  # 单开一组：真实浏览器要下 ~300MB 的 Chromium，不该把上面那几条快链路堵住。
  # 三端的全量无障碍扫描是各包最重的一块（每端两份文件、单份约三分钟），在浏览器配置里单成 *-a11y 项目，
  # 这里每端独占一片（--project=*-a11y*）；其余用例用 --project=!*-a11y* 排除它们，vue 再按 vitest --shard 切四片
  # （按文件路径哈希切连续区间，各片合起来不重不漏），react、web-components 与 position 合一片。
  # 以后新增的项目名不带 -a11y 就自动落进常规分片，不会漏跑。
  browser:
    name: 浏览器态（${{ matrix.name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: vue 1/4, id: vue-1, args: '--pkg=vue -- "--project=!*-a11y*" --shard=1/4' }
          - { name: vue 2/4, id: vue-2, args: '--pkg=vue -- "--project=!*-a11y*" --shard=2/4' }
          - { name: vue 3/4, id: vue-3, args: '--pkg=vue -- "--project=!*-a11y*" --shard=3/4' }
          - { name: vue 4/4, id: vue-4, args: '--pkg=vue -- "--project=!*-a11y*" --shard=4/4' }
          - { name: react + web-components + position, id: rest, args: '--pkg=react,web-components,position -- "--project=!*-a11y*"' }
          - { name: vue 无障碍, id: vue-a11y, args: '--pkg=vue -- "--project=*-a11y*"' }
          - { name: react 无障碍, id: react-a11y, args: '--pkg=react -- "--project=*-a11y*"' }
          - { name: web-components 无障碍, id: wc-a11y, args: '--pkg=web-components -- "--project=*-a11y*"' }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --fail-if-no-match --filter @xihan-ui/vue exec playwright install --with-deps chromium
      # 全库 53 处皮肤写 font-family: inherit，字体最终取文档根上的那一个，而截图用例把根上的
      # 字体族按名字写死成 DejaVu Sans。这个名字在 runner 上解析不到时会静默回落成别的字体，
      # 每个字形的栅格化结果都变，截图用例整体判红。这一步把那个名字装上。
      # 核对的是这个名字本身，不是默认 sans-serif——上一步的 --with-deps 会带进一批字体，
      # 默认 sans-serif 因此可能落到 Noto Sans 上，而画面一个像素都不变。
      - name: Install baseline font (DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-dejavu-core && fc-match 'DejaVu Sans'
      - name: Build
        run: pnpm build
      - name: Accessibility + visual baselines (real Chromium)
        run: pnpm test:browser ${{ matrix.args }}
      # 基线对不上时把实际截图与差异图带出来：像素差异在日志里看不出来，
      # 必须下载下来逐张比对，确认是有意的视觉改动才重出基线。
      # artifact 名按分片区分：同一轮里重名的 artifact 会让后传的那片上传失败。
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-diffs-${{ matrix.id }}
          path: ui/packages/adapters/*/.vitest-attachments/**
          # 落点是点开头的目录，upload-artifact 默认跳过隐藏文件，不开这个开关会报
          # 「No files were found」而一张图都不带出来
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-extras:
    name: 性能预算与自定义元素示例
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-ui
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --fail-if-no-match --filter @xihan-ui/vue exec playwright install --with-deps chromium
      - name: Build
        run: pnpm build
      # 示例文件在 docs/ 下，不在 turbo 对 test:browser 声明的输入集里，单开一步直接起 vitest
      - name: Web Components demos (real Chromium)
        run: pnpm gate:demos
      # 性能预算与像素基线共用 Playwright Linux 镜像，但额外固定 2 CPU / 2 GiB、
      # 800×520@1x 与 4× CPU throttle；宿主 runner 的瞬时规格不直接成为判据。
      - name: Pull visual performance image
        run: docker pull mcr.microsoft.com/playwright:v1.62.0-noble
      - name: Visual performance budget (default vs reduced transparency)
        run: pnpm visual:performance
