<!-- 输入组 | 圆角槽换成只留外侧的一组值，中缝用负外边距叠掉一条描边，相邻控件拼成一体 -->
<xh-text-field placeholder="搜索文档" clearable>
  <div data-xh-part="root">
    <label data-xh-part="label">站内搜索</label>
    <div style="display: flex">
      <!-- 输入框只留左侧圆角，右边一格外扣 1px 与按钮共用一条描边 -->
      <input
        data-xh-part="input"
        style="
          inline-size: 220px;
          margin-inline-end: -1px;
          --xh-text-field-input-radius: var(--xh-shape-control) 0 0 var(--xh-shape-control);
        "
      />
      <xh-button style="--xh-button-radius: 0 var(--xh-shape-control) var(--xh-shape-control) 0">
        <button data-xh-part="root">搜索</button>
      </xh-button>
    </div>
  </div>
</xh-text-field>

<xh-text-field placeholder="xihanfun">
  <div data-xh-part="root">
    <label data-xh-part="label">域名</label>
    <div style="display: flex">
      <!-- 前后两块固定文本与输入框同高同描边，圆角各留一侧 -->
      <span
        style="
          display: inline-flex;
          align-items: center;
          block-size: var(--xh-control-h-md);
          padding-inline: 12px;
          border: 1px solid var(--xh-border-default);
          border-radius: var(--xh-shape-control) 0 0 var(--xh-shape-control);
          background: var(--xh-bg-subtle);
          color: var(--xh-fg-muted);
          font-size: var(--xh-text-body-size);
        "
        >https://</span
      >
      <input
        data-xh-part="input"
        style="inline-size: 160px; margin-inline: -1px; --xh-text-field-input-radius: 0"
      />
      <span
        style="
          display: inline-flex;
          align-items: center;
          block-size: var(--xh-control-h-md);
          padding-inline: 12px;
          border: 1px solid var(--xh-border-default);
          border-radius: 0 var(--xh-shape-control) var(--xh-shape-control) 0;
          background: var(--xh-bg-subtle);
          color: var(--xh-fg-muted);
          font-size: var(--xh-text-body-size);
        "
        >.com</span
      >
    </div>
  </div>
</xh-text-field>
