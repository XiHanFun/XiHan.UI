<!-- 数据写法 | 只给 collection、不写结构时按标准结构铺：一条一个链接，文字取 label，末尾带滑动的指示条 -->
<div
  style="
    display: grid;
    grid-template-columns: minmax(112px, 140px) minmax(0, 1fr);
    gap: 20px;
    inline-size: min(640px, 100%);
    align-items: start;
  "
>
  <template id="anchor-data-nav">
    <xh-anchor smooth></xh-anchor>
  </template>

  <div
    id="anchor-data-scroll"
    data-xh-scroll
    style="
      block-size: 240px;
      overflow: auto;
      padding-inline: 12px;
      border-radius: var(--xh-shape-surface);
      background: var(--xh-bg-subtle);
    "
  >
    <div id="anchor-data-overview" style="block-size: 160px; padding-block: 12px">
      <strong>概览</strong>
      <p style="color: var(--xh-fg-muted)">概览相关内容</p>
    </div>
    <div id="anchor-data-install" style="block-size: 160px; padding-block: 12px">
      <strong>安装</strong>
      <p style="color: var(--xh-fg-muted)">安装相关内容</p>
    </div>
    <div id="anchor-data-theme" style="block-size: 160px; padding-block: 12px">
      <strong>主题</strong>
      <p style="color: var(--xh-fg-muted)">主题相关内容</p>
    </div>
    <div id="anchor-data-release" style="block-size: 160px; padding-block: 12px">
      <strong>发布</strong>
      <p style="color: var(--xh-fg-muted)">发布相关内容</p>
    </div>
  </div>
</div>

<script type="module">
  const template = document.getElementById("anchor-data-nav");
  const anchor = template.content.firstElementChild;
  anchor.collection = [
    { value: "anchor-data-overview", label: "概览" },
    { value: "anchor-data-install", label: "安装" },
    { value: "anchor-data-theme", label: "主题" },
    { value: "anchor-data-release", label: "发布" },
  ];
  anchor.target = document.getElementById("anchor-data-scroll");
  template.replaceWith(anchor);
</script>
