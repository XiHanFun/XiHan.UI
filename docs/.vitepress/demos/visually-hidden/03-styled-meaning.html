<!-- 补全样式里的意思 | 删除线只给眼睛看，读屏只会连读两个数字；把「原价」「现价」写成藏起来的文字 -->
<xh-typography>
  <div data-xh-part="root">
    <p data-xh-part="paragraph">
      <del data-xh-part="text" variant="muted" strikethrough><xh-visually-hidden><span data-xh-part="root">原价</span></xh-visually-hidden>¥199</del>
      <span data-xh-part="text" weight="semibold" tone="danger"><xh-visually-hidden><span data-xh-part="root">现价</span></xh-visually-hidden>¥129</span>
    </p>
  </div>
</xh-typography>
