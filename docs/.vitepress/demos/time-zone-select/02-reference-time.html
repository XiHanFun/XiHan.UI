<!-- 参考时刻 | 用排期当天而不是今天计算 DST 偏移 -->
<div id="tz-reference-host" data-demo-stack></div>
<script type="module">
  const mount = async (id, label, referenceTime) => {
    const host = document.createElement("xh-time-zone-select"); host.id = id; host.referenceTime = referenceTime; host.timeZones = ["America/New_York", "Europe/London", "Asia/Shanghai"]; host.translations = { label };
    host.innerHTML = `<div data-xh-part="root"><xh-combobox><div data-xh-part="root"><label data-xh-part="label"></label><div data-xh-part="control"><input data-xh-part="input"><button data-xh-part="clear-trigger"></button><button data-xh-part="trigger"></button></div><div data-xh-part="positioner"><div id="${id}-content" data-xh-part="content"></div><div data-xh-part="empty"></div></div><input data-xh-part="hidden-input"></div></xh-combobox></div>`;
    document.getElementById("tz-reference-host").append(host); await host.updateComplete;
  };
  await customElements.whenDefined("xh-time-zone-select");
  await mount("tz-winter", "冬季排期时区", Date.UTC(2026, 0, 15));
  await mount("tz-summer", "夏季排期时区", Date.UTC(2026, 6, 15));
</script>
