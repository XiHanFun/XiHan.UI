<!-- 状态与文案 | 禁用、校验失败和本地化文案沿用字段与 Combobox 契约 -->
<div id="tz-states-host"></div>
<script type="module">
  const zones = ["UTC", "Asia/Shanghai", "America/New_York"];
  const translations = { label: "会议时区", placeholder: "搜索城市或偏移", empty: "没有匹配的时区", trigger: "展开时区", clearTrigger: "清空时区" };
  const mount = async (state) => {
    const host = document.createElement("xh-time-zone-select"); Object.assign(host, { timeZones: zones, translations, ...state });
    const id = `tz-state-${document.getElementById("tz-states-host").childElementCount}`;
    host.innerHTML = `<div data-xh-part="root"><xh-combobox><div data-xh-part="root"><label data-xh-part="label"></label><div data-xh-part="control"><input data-xh-part="input"><button data-xh-part="clear-trigger"></button><button data-xh-part="trigger"></button></div><div data-xh-part="positioner"><div id="${id}-content" data-xh-part="content"></div><div data-xh-part="empty"></div></div><input data-xh-part="hidden-input"></div></xh-combobox></div>`;
    document.getElementById("tz-states-host").append(host); await host.updateComplete;
  };
  await customElements.whenDefined("xh-time-zone-select");
  await mount({ defaultValue: "UTC", disabled: true });
  await mount({ invalid: true });
</script>
