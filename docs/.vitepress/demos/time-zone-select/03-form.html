<!-- 表单提交 | 保存 IANA 时区名，而不是当前 UTC 偏移 -->
<form id="tz-form">
  <xh-time-zone-select id="tz-form-select" name="timeZone">
    <div data-xh-part="root"><xh-combobox><div data-xh-part="root"><label data-xh-part="label"></label><div data-xh-part="control"><input data-xh-part="input"><button data-xh-part="clear-trigger"></button><button data-xh-part="trigger"></button></div><div data-xh-part="positioner"><div id="tz-form-content" data-xh-part="content"></div><div data-xh-part="empty"></div></div><input data-xh-part="hidden-input"></div></xh-combobox></div>
  </xh-time-zone-select>
  <button type="submit">保存排期</button>
</form>
<script type="module">
  const host = document.getElementById("tz-form-select");
  await customElements.whenDefined("xh-time-zone-select"); host.timeZones = ["UTC", "Asia/Shanghai", "America/New_York"]; await host.updateComplete;
  document.getElementById("tz-form").addEventListener("submit", event => event.preventDefault());
</script>
