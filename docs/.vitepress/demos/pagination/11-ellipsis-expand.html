<!-- 摊开省略号 | 折进去的那几页悬停即摊开，点一下也摊开——纯悬停会把键盘用户挡在外面，而这几页除了这里没有别的入口；Escape 或点外面收起 -->
<xh-pagination
  id="pagination-expand"
  count="2000"
  page-size="10"
  default-page="100"
  style="inline-size: 100%"
>
  <nav data-xh-part="root">
    <button data-xh-part="prev-trigger"></button>
    <button data-xh-part="item" value="1">1</button>
    <button data-xh-part="ellipsis" side="start">…</button>
    <button data-xh-part="item" value="99">99</button>
    <button data-xh-part="item" value="100">100</button>
    <button data-xh-part="item" value="101">101</button>
    <button data-xh-part="ellipsis" side="end">…</button>
    <button data-xh-part="item" value="200">200</button>
    <button data-xh-part="next-trigger"></button>

    <!-- 同时只开一个省略位，一份定位层就够；面板里的页码由脚本按那一侧折进去的那几页铺 -->
    <div data-xh-part="positioner">
      <div data-xh-part="content"></div>
    </div>

    <span id="pagination-expand-readout" style="flex-basis: 100%">
      当前第 100 页，共 200 页
    </span>
  </nav>
</xh-pagination>

<script type="module">
  const TOTAL = 200;

  const nums = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

  // 页码序列：首尾各恒显一页，当前页两侧各留 siblings 页；空隙折成省略位，并记下折的是哪几页
  function pageItems(page, totalPages, siblings) {
    const asPages = (list) => list.map((value) => ({ value }));
    if (totalPages <= siblings * 2 + 5) return asPages(nums(1, totalPages));
    const width = siblings * 2 + 1;
    let start = page - siblings;
    let end = page + siblings;
    if (page <= siblings + 2) {
      start = 1;
      end = width + 2;
    } else if (page >= totalPages - siblings - 1) {
      start = totalPages - width - 1;
      end = totalPages;
    }
    const head =
      start <= 1
        ? []
        : start <= 3
          ? asPages(nums(1, start - 1))
          : [{ value: 1 }, { side: "start", pages: nums(2, start - 1) }];
    const tail =
      end >= totalPages
        ? []
        : end >= totalPages - 2
          ? asPages(nums(end + 1, totalPages))
          : [
              { side: "end", pages: nums(end + 1, totalPages - 1) },
              { value: totalPages },
            ];
    return [...head, ...asPages(nums(start, end)), ...tail];
  }

  const host = document.getElementById("pagination-expand");
  const root = host.querySelector('[data-xh-part="root"]');
  const next = root.querySelector('[data-xh-part="next-trigger"]');
  const content = root.querySelector('[data-xh-part="content"]');
  const readout = document.getElementById("pagination-expand-readout");

  function makeItem(value) {
    const el = document.createElement("button");
    el.dataset.xhPart = "item";
    el.setAttribute("value", String(value));
    el.textContent = String(value);
    return el;
  }

  // 每一侧折进去的是哪几页，摊开时照它铺面板
  let folded = { start: [], end: [] };
  let filled = null;

  function collect(items) {
    folded = { start: [], end: [] };
    filled = null;
    for (const item of items) {
      if (item.side) folded[item.side] = item.pages;
    }
  }

  function render(page) {
    const items = pageItems(page, TOTAL, 1);
    collect(items);
    // 只摘行里的格子：面板里的页码也是 item，不能一起清掉
    for (const node of [...root.children]) {
      const part = node.dataset.xhPart;
      if (part === "item" || part === "ellipsis") node.remove();
    }
    for (const item of items) {
      if (item.side) {
        const el = document.createElement("button");
        el.dataset.xhPart = "ellipsis";
        el.setAttribute("side", item.side);
        el.textContent = "…";
        root.insertBefore(el, next);
      } else {
        root.insertBefore(makeItem(item.value), next);
      }
    }
    readout.textContent = `当前第 ${page} 页，共 ${TOTAL} 页`;
  }

  // 指针停上去与按下去都会摊开，面板照那一侧折进去的页码铺
  function fill(el) {
    const side = el.getAttribute("side");
    if (filled === side) return;
    filled = side;
    content.replaceChildren(...folded[side].map(makeItem));
  }

  for (const type of ["pointerover", "click"]) {
    root.addEventListener(type, (event) => {
      const el = event.target.closest('[data-xh-part="ellipsis"]');
      if (el) fill(el);
    });
  }

  collect(pageItems(100, TOTAL, 1));
  host.addEventListener("page-change", (event) => render(event.detail.page));
</script>
