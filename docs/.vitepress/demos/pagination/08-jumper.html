<!-- 快速跳页 | 输入框按 Enter 调插槽给的 setPage；越界页码由它夹回合法区间 -->
<xh-pagination
  id="pagination-jumper"
  count="1000"
  page-size="10"
  page="5"
  style="inline-size: 100%"
>
  <nav data-xh-part="root">
    <button data-xh-part="prev-trigger"></button>
    <button data-xh-part="item" value="1">1</button>
    <button data-xh-part="ellipsis" side="start">…</button>
    <button data-xh-part="item" value="4">4</button>
    <button data-xh-part="item" value="5">5</button>
    <button data-xh-part="item" value="6">6</button>
    <button data-xh-part="ellipsis" side="end">…</button>
    <button data-xh-part="item" value="100">100</button>
    <button data-xh-part="next-trigger"></button>

    <xh-text-field
      id="pagination-jumper-field"
      value=""
      size="sm"
      placeholder="页码"
    >
      <div data-xh-part="root">
        <input
          data-xh-part="input"
          aria-label="跳至页码"
          style="inline-size: 72px"
        />
      </div>
    </xh-text-field>
  </nav>
</xh-pagination>

<script type="module">
  const TOTAL = 100;

  // 页码序列：首尾各恒显一页，当前页两侧各留 siblings 页，中间的空隙折成省略位
  function pageItems(page, totalPages, siblings) {
    const range = (a, b) =>
      Array.from({ length: b - a + 1 }, (_, i) => ({ value: a + i }));
    if (totalPages <= siblings * 2 + 5) return range(1, totalPages);
    const width = siblings * 2 + 1;
    let start = page - siblings;
    let end = page + siblings;
    if (page <= siblings + 2) {
      start = 1;
      end = width + 2;
    } else if (page >= totalPages - siblings - 1) {
      start = totalPages - width - 1;
      end = totalPages;
    }
    const head =
      start <= 1
        ? []
        : start <= 3
          ? range(1, start - 1)
          : [{ value: 1 }, { side: "start" }];
    const tail =
      end >= totalPages
        ? []
        : end >= totalPages - 2
          ? range(end + 1, totalPages)
          : [{ side: "end" }, { value: totalPages }];
    return [...head, ...range(start, end), ...tail];
  }

  const host = document.getElementById("pagination-jumper");
  const root = host.querySelector('[data-xh-part="root"]');
  const next = root.querySelector('[data-xh-part="next-trigger"]');
  const field = document.getElementById("pagination-jumper-field");
  const input = field.querySelector('[data-xh-part="input"]');

  // 页码写回 page；越界值照写不误，当前页那一格由分页自己夹回合法区间
  function goto(page) {
    host.page = page;
    for (const node of root.querySelectorAll(
      '[data-xh-part="item"], [data-xh-part="ellipsis"]',
    ))
      node.remove();
    for (const item of pageItems(page, TOTAL, 1)) {
      const el = document.createElement("button");
      if (item.side) {
        el.dataset.xhPart = "ellipsis";
        el.setAttribute("side", item.side);
        el.textContent = "…";
      } else {
        el.dataset.xhPart = "item";
        el.setAttribute("value", String(item.value));
        el.textContent = String(item.value);
      }
      root.insertBefore(el, next);
    }
  }

  host.addEventListener("page-change", (event) => goto(event.detail.page));
  field.addEventListener("value-change", (event) => {
    field.value = event.detail.value;
  });

  // 只放正整数进去，其余按无效输入丢掉
  input.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const target = Number(field.value);
    if (Number.isInteger(target) && target > 0) {
      goto(target);
    }
    field.value = "";
  });
</script>
