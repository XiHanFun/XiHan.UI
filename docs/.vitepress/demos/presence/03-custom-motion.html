<!-- 自定义进出场 | 两个覆盖槽各收一整条 animation 简写，换成自己的关键帧；退场那条带 forwards，位移取幅度令牌，减弱动效下只剩淡变 -->
<style>
  .presence-demo-rise {
    --xh-presence-enter-animation: presence-demo-rise-in var(--xh-motion-duration-enter) var(--xh-motion-ease-enter);
    --xh-presence-exit-animation: presence-demo-sink-out var(--xh-motion-duration-exit) var(--xh-motion-ease-exit) forwards;
  }

  @keyframes presence-demo-rise-in {
    from {
      opacity: 0;
      translate: 0 var(--xh-motion-distance-md);
    }
  }

  @keyframes presence-demo-sink-out {
    to {
      opacity: 0;
      translate: 0 var(--xh-motion-distance-md);
    }
  }
</style>
<div style="inline-size: 100%; display: grid; gap: var(--xh-space-3)">
  <xh-button id="presence-custom-toggle" size="sm">
    <button data-xh-part="root" style="justify-self: start">显示提示</button>
  </xh-button>
  <xh-presence id="presence-custom">
    <div data-xh-part="root" class="presence-demo-rise">
      <template>
        <xh-alert tone="info">
          <div data-xh-part="root">
            <div data-xh-part="content">
              <div data-xh-part="title">有 3 条新评论</div>
              <div data-xh-part="description">出现时从下方浮上来，消失时沉回去。</div>
            </div>
          </div>
        </xh-alert>
      </template>
    </div>
  </xh-presence>
</div>

<script type="module">
  // 动画全在上面那两个覆盖槽里，这里只切 present
  const presence = document.getElementById("presence-custom");
  const toggle = document.getElementById("presence-custom-toggle");
  const label = toggle.querySelector('[data-xh-part="root"]');
  toggle.addEventListener("click", () => {
    presence.present = !presence.present;
    label.textContent = presence.present ? "收起提示" : "显示提示";
  });
</script>
