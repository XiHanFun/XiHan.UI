<div style="display: flex; flex-wrap: wrap; gap: 8px">

  <xh-kbd value="Shift"><kbd data-xh-part="root"></kbd></xh-kbd>
  <xh-kbd value="ArrowUp"><kbd data-xh-part="root"></kbd></xh-kbd>
  <xh-kbd value="Escape"><kbd data-xh-part="root"></kbd></xh-kbd>
  <xh-kbd value="Enter"><kbd data-xh-part="root"></kbd></xh-kbd>
</div>
