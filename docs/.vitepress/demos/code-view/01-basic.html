<!-- 基础用法 | 代码原文由宿主给，组件切出逐行结构并铺记号；渲了文件名它就成为代码块的可访问名 -->
<!-- complete 表示这段代码已经写完，可以放心着色 -->
<xh-code-view
  code="export function createTicker(intervalTime: number) {
  let handle = 0
  return {
    start(onTick: () => void) {
      handle = setInterval(onTick, intervalTime)
    },
    stop() {
      clearInterval(handle)
    },
  }
}"
