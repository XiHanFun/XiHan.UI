<!-- 形态、语气与尺寸 | 默认渐隐弧，另有 ring 整圈与 dots 三点；tone 只更换圆环起始边一段的颜色，轨道保持中性描边，旋转时才能看出差别；size 只改变直径，默认档 md 不输出 data-size -->
<div style="display: flex; flex-direction: column; gap: var(--xh-space-6)">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-6)">
    <xh-spinner label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
    <xh-spinner variant="ring" label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
    <xh-spinner variant="dots" label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
  </div>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-6)">
    <!-- 语气名写在旁边的普通文字上，转圈自身的可及名字仍是"加载中" -->
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="brand" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">brand</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="neutral" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">neutral</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="success" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">success</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="warning" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">warning</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="danger" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">danger</span>
    </span>
    <span style="display: inline-flex; align-items: center; gap: var(--xh-space-2)">
      <xh-spinner tone="info" label="加载中">
        <span data-xh-part="root"></span>
      </xh-spinner>
      <span style="font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">info</span>
    </span>
  </div>

  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-6)">
    <xh-spinner size="sm" label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
    <xh-spinner label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
    <xh-spinner size="lg" label="加载中">
      <span data-xh-part="root"></span>
    </xh-spinner>
  </div>
</div>
