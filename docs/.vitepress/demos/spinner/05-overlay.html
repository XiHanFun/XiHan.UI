<!-- 遮罩形态 | overlay 包住一块内容：等待时盖一层遮罩、转圈居中，内容报 aria-busy 且点不到；loading 改成 false 即撤下 -->
<div style="inline-size: 100%; display: grid; gap: var(--xh-space-3); justify-items: start">
  <xh-button variant="outline" size="sm">
    <button data-xh-part="root" id="spinner-overlay-toggle">数据回来了</button>
  </xh-button>

  <!-- 外框接住作者写的样式：遮罩照它的圆角铺满 -->
  <xh-spinner id="spinner-overlay" overlay label="正在刷新报表">
    <div data-xh-part="container" style="inline-size: 260px; border-radius: var(--xh-shape-surface)">
      <div data-xh-part="content">
        <div
          style="
            padding: var(--xh-space-4);
            border: var(--xh-stroke-thin) solid var(--xh-border-default);
            border-radius: var(--xh-shape-surface);
          "
        >
          <p style="margin: 0">本季新增客户 128 家，环比增长 12%。</p>
        </div>
      </div>
      <div data-xh-part="mask">
        <span data-xh-part="root">
          <span data-xh-part="label">正在刷新报表</span>
        </span>
      </div>
    </div>
  </xh-spinner>
</div>

<script type="module">
  const toggle = document.getElementById("spinner-overlay-toggle");
  const spinner = document.getElementById("spinner-overlay");

  toggle.addEventListener("click", () => {
    spinner.loading = spinner.loading === false;
    toggle.textContent = spinner.loading === false ? "重新加载" : "数据回来了";
  });
</script>
