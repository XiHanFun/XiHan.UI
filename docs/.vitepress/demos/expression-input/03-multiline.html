<!-- 多行 | 长公式分行写：autoSize 给出行数上下限，问题位置带上行号，补全浮层跟着光标 -->
<xh-expression-input
  id="expression-input-multiline"
  label="折后金额"
  multiline
  default-value='IF(level == "gold",
  amount * 0.9,
  amont)'
></xh-expression-input>

<script type="module">
  import { createExpressionCheck, createExpressionEngine } from "@xihan-ui/expression";

  const fields = [
    { label: "amount", kind: "variable", detail: "数字", description: "报销金额" },
    { label: "level", kind: "variable", detail: "文本", description: "会员等级" },
  ];

  const input = document.getElementById("expression-input-multiline");

  input.autoSize = { minRows: 3, maxRows: 6 };
  input.completions = fields;
  input.check = createExpressionCheck(createExpressionEngine(), {
    identifiers: fields.map((field) => field.label),
  });
</script>
