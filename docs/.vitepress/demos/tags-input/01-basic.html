<!-- 基础用法 | 只写根组件就按标准结构铺出标题与盒，标签按当前值铺；在框中输入后按 Enter 落下一个标签 -->
<xh-tags-input id="tags-input-basic" label="技术栈" placeholder="回车落一个"></xh-tags-input>
<p data-demo-output>当前：<span id="tags-input-basic-value">Vue、TypeScript</span></p>

<script type="module">
  // 值是数组，只走属性；标签由组件按当前值铺
  const field = document.getElementById("tags-input-basic");
  const readout = document.getElementById("tags-input-basic-value");
  field.defaultValue = ["Vue", "TypeScript"];
  field.addEventListener("value-change", (event) => {
    readout.textContent = event.detail.value.join("、") || "（无）";
  });
</script>
