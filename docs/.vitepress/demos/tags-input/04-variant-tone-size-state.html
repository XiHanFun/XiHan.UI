<!-- 形态、语气、尺寸与状态 | variant 只改变控件的颜色槽位，标签形态按控件的面派生（subtle 中是描边标签，其余是淡底标签）；tone 与 variant 正交；size 让控件高度、胶囊与输入文字一起换档；disabled 整个控件退出 Tab 序列、标签一起置灰，read-only 仍可聚焦浏览但不能加入也不能删除、标签不置灰 -->
