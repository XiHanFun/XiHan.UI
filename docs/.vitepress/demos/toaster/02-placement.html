<!-- 落位 | placement 决定这一摞贴视口的哪个角，换的只是 group 上的 data-placement，队列本身不动 -->
<xh-toaster id="toaster-placement" placement="top-end">
  <div data-xh-part="root">
    <xh-button size="sm" variant="outline" data-spot="top-start">
      <button data-xh-part="root">top-start</button>
    </xh-button>
    <xh-button size="sm" variant="outline" data-spot="top">
      <button data-xh-part="root">top</button>
    </xh-button>
    <xh-button size="sm" variant="solid" data-spot="top-end">
      <button data-xh-part="root">top-end</button>
    </xh-button>
    <xh-button size="sm" variant="outline" data-spot="bottom-start">
      <button data-xh-part="root">bottom-start</button>
    </xh-button>
    <xh-button size="sm" variant="outline" data-spot="bottom">
      <button data-xh-part="root">bottom</button>
    </xh-button>
    <xh-button size="sm" variant="outline" data-spot="bottom-end">
      <button data-xh-part="root">bottom-end</button>
    </xh-button>
    <xh-button variant="ghost" data-create>
      <button data-xh-part="root">弹一条</button>
    </xh-button>

    <div data-xh-part="group"></div>
  </div>
</xh-toaster>

<template id="toaster-placement-template">
  <xh-toast>
    <div data-xh-part="root">
      <div data-xh-part="title"></div>
      <div data-xh-part="description"></div>
      <button data-xh-part="close-trigger"></button>
    </div>
  </xh-toast>
</template>

<script type="module">
  const toaster = document.getElementById("toaster-placement");
  const group = toaster.querySelector('[data-xh-part="group"]');
  const template = document.getElementById("toaster-placement-template");
  const translations = { close: "关闭" };

  // 队列变了就把这一摞重铺一遍
  function render() {
    const list = toaster.visibleToasts;
    const alive = new Set(list.map((toast) => toast.id));
    for (const node of [...group.children]) {
      if (!alive.has(node.toastId)) {
        node.remove();
      }
    }
    for (const toast of list) {
      let node = [...group.children].find((el) => el.toastId === toast.id);
      if (!node) {
        node = document.importNode(template.content.firstElementChild, true);
        node.toastId = toast.id;
        node.translations = translations;
        group.append(node);
      }
      node.titleText = toast.title;
      node.description = toast.description;
      node.type = toast.type;
      node.duration = toast.duration;
      node.removeDelay = toast.removeDelay;
      node.closable = toast.closable;
    }
  }

  toaster.addEventListener("toasts-change", render);

  // 换落位只改 toaster 的一个属性，选中的那颗按钮换成实心
  const spots = [...toaster.querySelectorAll("[data-spot]")];
  for (const button of spots) {
    button.addEventListener("click", () => {
      toaster.placement = button.dataset.spot;
      for (const other of spots) {
        other.setAttribute("variant", other === button ? "solid" : "outline");
      }
    });
  }

  toaster.querySelector("[data-create]").addEventListener("click", () => {
    toaster.create({
      title: "换个角看看",
      description: `现在贴在 ${toaster.placement}`,
    });
  });
</script>
