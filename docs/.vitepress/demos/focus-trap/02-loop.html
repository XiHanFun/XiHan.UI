<!-- 不回绕 | loop 为 false 时 Tab 停在最后一个、Shift+Tab 停在第一个，焦点仍出不去；autoFocus 为 false 时激活不挪焦点，等焦点进来再陷住 -->
<xh-focus-trap loop="false" auto-focus="false">
  <div data-xh-part="root" style="display: flex; flex-wrap: wrap; gap: var(--xh-space-2)">
    <xh-button tone="neutral"><button data-xh-part="root">上一步</button></xh-button>
    <xh-button tone="neutral"><button data-xh-part="root">下一步</button></xh-button>
    <xh-button><button data-xh-part="root">提交</button></xh-button>
  </div>
</xh-focus-trap>
