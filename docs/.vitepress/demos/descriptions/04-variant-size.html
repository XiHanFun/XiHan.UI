<!-- 形态与尺寸 | ghost 不画壳，subtle 铺一层淡底，outline 绘制一圈描边并在格与格之间补上网格线；size 改变每格的内边距、组与组的间距与整体字号，不传即默认档 -->
<div style="display: flex; flex-direction: column; gap: var(--xh-space-8)">
  <div style="display: flex; flex-direction: column; gap: var(--xh-space-4)">
    <xh-descriptions variant="ghost" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">无壳 · 商品</dt>
          <dd data-xh-part="value">机械键盘</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">无壳 · 单价</dt>
          <dd data-xh-part="value">￥499.00</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">无壳 · 数量</dt>
          <dd data-xh-part="value">2</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">无壳 · 小计</dt>
          <dd data-xh-part="value">￥998.00</dd>
        </div>
      </dl>
    </xh-descriptions>

    <xh-descriptions variant="subtle" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">淡底 · 商品</dt>
          <dd data-xh-part="value">机械键盘</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">淡底 · 单价</dt>
          <dd data-xh-part="value">￥499.00</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">淡底 · 数量</dt>
          <dd data-xh-part="value">2</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">淡底 · 小计</dt>
          <dd data-xh-part="value">￥998.00</dd>
        </div>
      </dl>
    </xh-descriptions>

    <xh-descriptions variant="outline" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">描边 · 商品</dt>
          <dd data-xh-part="value">机械键盘</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">描边 · 单价</dt>
          <dd data-xh-part="value">￥499.00</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">描边 · 数量</dt>
          <dd data-xh-part="value">2</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">描边 · 小计</dt>
          <dd data-xh-part="value">￥998.00</dd>
        </div>
      </dl>
    </xh-descriptions>
  </div>

  <div style="display: flex; flex-direction: column; gap: var(--xh-space-4)">
    <xh-descriptions size="sm" variant="outline" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">小 · 状态</dt>
          <dd data-xh-part="value">已发货</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">小 · 承运商</dt>
          <dd data-xh-part="value">顺丰速运</dd>
        </div>
      </dl>
    </xh-descriptions>

    <!-- 中间这一档不写 size -->
    <xh-descriptions variant="outline" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">默认 · 状态</dt>
          <dd data-xh-part="value">已发货</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">默认 · 承运商</dt>
          <dd data-xh-part="value">顺丰速运</dd>
        </div>
      </dl>
    </xh-descriptions>

    <xh-descriptions size="lg" variant="outline" columns="2" placement="left">
      <dl data-xh-part="root">
        <div data-xh-part="item">
          <dt data-xh-part="label">大 · 状态</dt>
          <dd data-xh-part="value">已发货</dd>
        </div>
        <div data-xh-part="item">
          <dt data-xh-part="label">大 · 承运商</dt>
          <dd data-xh-part="value">顺丰速运</dd>
        </div>
      </dl>
    </xh-descriptions>
  </div>
</div>
