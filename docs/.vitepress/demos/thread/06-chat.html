<!-- 会话页 | 线程管滚动与粘底，编辑器管收话：发出去先落一条自己的消息，回话一段段写进来时消息区自动跟到底 -->
<div style="width: 100%; display: grid; gap: 12px">
  <xh-thread id="thread-chat" status="idle">
    <div data-xh-part="root" style="block-size: 240px">
      <div data-xh-part="viewport">
        <div data-xh-part="content" id="thread-chat-content">
          <p style="margin: 0"><strong>助手：</strong>有什么想问的？</p>
        </div>
      </div>
      <button data-xh-part="scroll-button">回到底部</button>
    </div>
  </xh-thread>

  <xh-composer id="thread-chat-composer" run-status="ready">
    <div data-xh-part="root">
      <textarea data-xh-part="input" placeholder="说点什么…" rows="1"></textarea>
      <button data-xh-part="submit-trigger">发送</button>
    </div>
  </xh-composer>
</div>

<script type="module">
  const thread = document.getElementById("thread-chat");
  const content = document.getElementById("thread-chat-content");
  const composer = document.getElementById("thread-chat-composer");
  const trigger = composer.querySelector('[data-xh-part="submit-trigger"]');
  const reply =
    "好的，这就往下写。消息一段段进来时，消息区跟着往下走；你要是自己滚上去看旧消息，它就停在那儿等你回来。";
  let timer = 0;

  // 两处运行态各自铺成属性，按钮的文字跟着换
  function setStatus(status) {
    thread.setAttribute("status", status);
    composer.setAttribute("run-status", status === "streaming" ? "streaming" : "ready");
    trigger.textContent = status === "streaming" ? "停止" : "发送";
  }

  // 往消息区补一条，返回正文节点以便后续改写
  function append(role, text) {
    const line = document.createElement("p");
    line.style.margin = "0";
    const who = document.createElement("strong");
    who.textContent = `${role}：`;
    const body = document.createTextNode(text);
    line.append(who, body);
    content.append(line);
    return body;
  }

  composer.addEventListener("submit", (event) => {
    window.clearTimeout(timer);
    append("用户", event.detail.value);
    const body = append("助手", "");
    setStatus("streaming");

    let cut = 0;
    const step = () => {
      cut += 6;
      body.textContent = reply.slice(0, cut);
      if (cut < reply.length) {
        timer = window.setTimeout(step, 90);
        return;
      }
      setStatus("idle");
    };
    step();
  });

  // 停止只是不再往下写，已经写出来的那半段留在原处
  composer.addEventListener("stop", () => {
    window.clearTimeout(timer);
    setStatus("idle");
  });
</script>
