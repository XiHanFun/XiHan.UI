<!-- 平台 | Mac 使用符号，其他平台使用文字 -->
<div style="display: flex; align-items: center; gap: 24px">
  <span style="display: flex; align-items: center; gap: 8px">
    <span>Mac</span>
    <xh-kbd-group keys="Mod,S" platform="mac">
      <span data-xh-part="root"></span>
    </xh-kbd-group>
  </span>
  <span style="display: flex; align-items: center; gap: 8px">
    <span>Windows</span>
    <xh-kbd-group keys="Mod,S" platform="other">
      <span data-xh-part="root"></span>
    </xh-kbd-group>
  </span>
</div>
