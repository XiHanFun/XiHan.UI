<!-- 可关闭标签 | 根是 inline-flex 且自带间距，关闭件直接写进内容里跟文字并排；点击语义、Tab 停靠与回车触发由原生按钮自带 -->
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
  <span id="badge-closable-tags" style="display: contents">
    <xh-badge variant="subtle" tone="brand">
      <span data-xh-part="root">
        设计
        <!-- 关闭件的名字给全，读屏念到的是「移除 设计」而不是一个叉 -->
        <button
          type="button"
          data-close
          aria-label="移除 设计"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: 1;
            cursor: pointer;
          "
        >
          ×
        </button>
      </span>
    </xh-badge>

    <xh-badge variant="subtle" tone="brand">
      <span data-xh-part="root">
        前端
        <button
          type="button"
          data-close
          aria-label="移除 前端"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: 1;
            cursor: pointer;
          "
        >
          ×
        </button>
      </span>
    </xh-badge>

    <xh-badge variant="subtle" tone="brand">
      <span data-xh-part="root">
        无头内核
        <button
          type="button"
          data-close
          aria-label="移除 无头内核"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: 1;
            cursor: pointer;
          "
        >
          ×
        </button>
      </span>
    </xh-badge>

    <xh-badge variant="subtle" tone="brand">
      <span data-xh-part="root">
        可访问性
        <button
          type="button"
          data-close
          aria-label="移除 可访问性"
          style="
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            line-height: 1;
            cursor: pointer;
          "
        >
          ×
        </button>
      </span>
    </xh-badge>
  </span>

  <span id="badge-closable-empty" style="display: none; font-size: 13px">
    已全部移除
  </span>

  <xh-button id="badge-closable-restore" size="sm" variant="ghost" style="display: none">
    <button data-xh-part="root">还原</button>
  </xh-button>
</div>

<script type="module">
  // 点关闭件把那枚标签摘掉，还原按钮把它们按原序放回来
  const list = document.getElementById("badge-closable-tags");
  const empty = document.getElementById("badge-closable-empty");
  const restore = document.getElementById("badge-closable-restore");
  const all = [...list.children];

  function paint() {
    empty.style.display = list.children.length ? "none" : "";
    restore.style.display = list.children.length < all.length ? "" : "none";
  }

  for (const tag of all) {
    tag.querySelector("[data-close]").addEventListener("click", () => {
      tag.remove();
      paint();
    });
  }

  restore.querySelector('[data-xh-part="root"]').addEventListener("click", () => {
    list.replaceChildren(...all);
    paint();
  });
</script>
