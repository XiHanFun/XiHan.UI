<!-- 语气 | tone 决定用哪族颜色，与 variant 正交；这里固定 solid 形态只看语气的差别 -->
<xh-badge variant="solid" tone="brand">
  <span data-xh-part="root">brand</span>
</xh-badge>

<xh-badge variant="solid" tone="neutral">
  <span data-xh-part="root">neutral</span>
</xh-badge>

<xh-badge variant="solid" tone="success">
  <span data-xh-part="root">success</span>
</xh-badge>

<xh-badge variant="solid" tone="warning">
  <span data-xh-part="root">warning</span>
</xh-badge>

<xh-badge variant="solid" tone="danger">
  <span data-xh-part="root">danger</span>
</xh-badge>

<xh-badge variant="solid" tone="info">
  <span data-xh-part="root">info</span>
</xh-badge>
