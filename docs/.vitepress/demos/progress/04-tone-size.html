<!-- 语气与尺寸 | tone 决定进度段用哪族颜色，不写时沿用品牌色；size 只改变轨道厚度，不写即默认中档 -->
<div style="width: 100%; display: grid; gap: var(--xh-space-6)">
  <div style="display: grid; gap: var(--xh-space-3)">
    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">brand</span>
      <xh-progress value="65" tone="brand" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">neutral</span>
      <xh-progress value="65" tone="neutral" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">success</span>
      <xh-progress value="65" tone="success" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">warning</span>
      <xh-progress value="65" tone="warning" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">danger</span>
      <xh-progress value="65" tone="danger" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">info</span>
      <xh-progress value="65" tone="info" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>
  </div>

  <div style="display: grid; gap: var(--xh-space-4)">
    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">sm</span>
      <xh-progress value="65" size="sm" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">缺省</span>
      <xh-progress value="65" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>

    <div style="display: flex; gap: var(--xh-space-3); align-items: center">
      <span style="min-width: 64px; font-size: var(--xh-text-caption-size); color: var(--xh-fg-muted)">lg</span>
      <xh-progress value="65" size="lg" style="flex: 1">
        <div data-xh-part="root">
          <div data-xh-part="track">
            <div data-xh-part="range"></div>
          </div>
        </div>
      </xh-progress>
    </div>
  </div>
</div>
