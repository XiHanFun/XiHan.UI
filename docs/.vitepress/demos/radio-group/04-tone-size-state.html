<!-- 语气、尺寸与状态 | tone 决定选中圆点使用哪族颜色；size 改变条目间距与字号，不写即默认中档；单项禁用后不可点击、方向键也跳过它，整组禁用则每一项都随之禁用 -->
<div style="display: flex; flex-direction: column; gap: var(--xh-space-6)">
  <div style="display: flex; gap: var(--xh-space-8); flex-wrap: wrap">
    <xh-radio-group tone="brand" default-value="yes">
      <div data-xh-part="root">
        <span data-xh-part="label">brand</span>
        <div data-xh-part="item" value="yes">
          <input data-xh-part="hidden-input" />
          <span data-xh-part="indicator"></span>
          <span data-xh-part="item-text">选中</span>
        </div>
        <div data-xh-part="item" value="no">
          <input data-xh-part="hidden-input" />
          <span data-xh-part="indicator"></span>
          <span data-xh-part="item-text">未选</span>
        </div>
      </div>
    </xh-radio-group>

    <xh-radio-group tone="danger" default-value="yes">
      <div data-xh-part="root">
        <span data-xh-part="label">danger</span>
        <div data-xh-part="item" value="yes">

        </div>
      </div>
    </xh-radio-group>

  <div style="display: flex; gap: var(--xh-space-8); flex-wrap: wrap; align-items: flex-start">
