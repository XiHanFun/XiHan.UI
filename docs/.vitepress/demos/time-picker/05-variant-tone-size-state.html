<!-- 形态、语气、尺寸与状态 | variant 决定描边与底色的绘制方式、tone 决定使用哪族颜色、size 切换几何档，三者只落在 root，浮层中的格子一并随之变化；禁用整条退出 Tab 序列，只读仍能展开浏览只是不可修改值，invalid 只改变标注 -->
<div id="time-picker-axes" style="display: flex; flex-direction: column; gap: var(--xh-space-6)"></div>

<!-- 结构先收在模板里：列里的格子要在元素接线前就位，所以铺满了才入页 -->
<template id="time-picker-axes-shell">
  <xh-time-picker default-value="09:30">
    <div data-xh-part="root">
      <label data-xh-part="label"></label>
      <div data-xh-part="control">
        <div data-xh-part="segment-group">
          <span data-xh-part="segment" segment="hour"></span>
          <span>:</span>
          <span data-xh-part="segment" segment="minute"></span>
        </div>
        <button data-xh-part="clear-trigger"></button>
        <button data-xh-part="trigger"></button>
      </div>
      <div data-xh-part="positioner">
        <div data-xh-part="content">
          <div data-xh-part="column" unit="hour"></div>
          <div data-xh-part="column" unit="minute"></div>
        </div>
      </div>
    </div>
  </xh-time-picker>
</template>

<script type="module">
  const stage = document.getElementById("time-picker-axes");
  const shell = document.getElementById("time-picker-axes-shell");

  // 往一列里铺 count 格，值是两位补零的显示串
  function fill(column, count) {
    for (let i = 0; i < count; i++) {
      const item = document.createElement("div");
      item.dataset.xhPart = "item";
      item.setAttribute("value", String(i).padStart(2, "0"));
      column.append(item);
    }
  }

  function build(label, name, value, clearable) {
    const node = shell.content.cloneNode(true);
    node.querySelector("xh-time-picker").setAttribute(name, value);
    node.querySelector('[data-xh-part="label"]').textContent = label;
    if (!clearable) node.querySelector('[data-xh-part="clear-trigger"]').remove();
    fill(node.querySelector('[unit="hour"]'), 24);
    fill(node.querySelector('[unit="minute"]'), 60);
    return node;
  }

  // 前三行一行只换一根轴，标题写的就是那一档的取值
  const rows = [
    { axis: "variant", values: ["outline", "subtle", "ghost"] },
    { axis: "tone", values: ["brand", "success", "danger"] },
    { axis: "size", values: ["sm", "md", "lg"] },
  ];

  for (const row of rows) {
    const line = document.createElement("div");
    line.style.cssText = "display: flex; flex-wrap: wrap; gap: var(--xh-space-4)";
    for (const value of row.values) line.append(build(value, row.axis, value, true));
    stage.append(line);
  }

  // 末行切状态
  const states = [
    { label: "禁用", flag: "disabled" },
    { label: "只读", flag: "read-only" },
    { label: "校验失败", flag: "invalid" },
  ];

  const line = document.createElement("div");
  line.style.cssText = "display: grid; gap: var(--xh-space-4); justify-items: start";
  for (const state of states) line.append(build(state.label, state.flag, "", false));
  stage.append(line);
</script>
