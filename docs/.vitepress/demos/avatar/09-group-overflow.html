<!-- 成组与溢出计数 | 组内共用的直径、字号、形状在容器上写一次，自定义属性沿继承流给每一枚；超出上限的收成一枚「+N」，它只是又一枚落回退态的头像 -->
<div style="display: grid; gap: 16px">

      --xh-avatar-size: 36px;
      --xh-avatar-font-size: 14px;
    "
