<!-- 语气与尺寸 | tone 改变淡底与回退文字的配色组，不写即中性缺省；size 三档只改变直径，回退文字的字号随之缩放，默认档不输出 data-size -->
<div style="display: grid; gap: var(--xh-space-4)">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--xh-space-3)">
    <!-- 不写 tone 的那一枚：中性缺省 -->
    <xh-avatar>
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">XH</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="brand">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">曦</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="neutral">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">中</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="success">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">成</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="warning">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">警</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="danger">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">危</span>
      </span>
    </xh-avatar>

    <xh-avatar tone="info">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">信</span>
      </span>
    </xh-avatar>
  </div>

  <!-- 有图的一行：图片铺满 root，跟着三档一起缩放 -->
  <div style="display: flex; align-items: center; gap: var(--xh-space-3)">
    <xh-avatar size="sm" src="/images/demo-avatar.svg" alt="曦寒">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">曦</span>
      </span>
    </xh-avatar>
    <xh-avatar src="/images/demo-avatar.svg" alt="曦寒">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">曦</span>
      </span>
    </xh-avatar>
    <xh-avatar size="lg" src="/images/demo-avatar.svg" alt="曦寒">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">曦</span>
      </span>
    </xh-avatar>
    <span style="color: var(--xh-fg-muted); font-size: var(--xh-text-caption-size)">sm / 缺省 / lg</span>
  </div>

  <!-- 落回退态的一行：小头像里的字不撑出去，大头像里的字也不显小 -->
  <div style="display: flex; align-items: center; gap: var(--xh-space-3)">
    <xh-avatar size="sm">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">XH</span>
      </span>
    </xh-avatar>
    <xh-avatar>
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">XH</span>
      </span>
    </xh-avatar>
    <xh-avatar size="lg">
      <span data-xh-part="root">
        <img data-xh-part="image" />
        <span data-xh-part="fallback">XH</span>
      </span>
    </xh-avatar>
    <span style="color: var(--xh-fg-muted); font-size: var(--xh-text-caption-size)">回退字随档位缩放</span>
  </div>
</div>
