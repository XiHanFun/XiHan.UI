<!-- props 写法 | 不写结构时按标准结构铺：标题与说明两个属性写出一块空状态，图标与操作用同名插槽 -->
<xh-empty-state title-text="还没有任何工单" description="新建一条工单，或者换个筛选条件再看看。">
  <!-- 只写一个空的 root 承载样式，各段由元素生成 -->
  <div data-xh-part="root" style="inline-size: 100%"></div>
  <span slot="indicator">∅</span>
  <xh-button slot="action" variant="solid">
    <button data-xh-part="root">新建工单</button>
  </xh-button>
</xh-empty-state>
