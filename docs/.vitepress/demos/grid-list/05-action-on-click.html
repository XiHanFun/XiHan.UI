<!-- 点行看详情 | actionOnClick 让点行触发行主操作（看详情），勾选只由行首方框与 Space 改变，适合一边勾选做批量操作、一边点开某一行 -->
<div data-demo-stack>
  <xh-grid-list id="grid-list-action-on-click" selection-mode="multiple" action-on-click>
    <div data-xh-part="root">
      <span data-xh-part="label">缓存键</span>
      <div data-xh-part="row" value="user:global"><span data-xh-part="row-selection-indicator"></span><div data-xh-part="row-content"><span data-xh-part="row-text">user:global</span><span data-xh-part="row-description">全局偏好</span></div></div>
      <div data-xh-part="row" value="user:guide"><span data-xh-part="row-selection-indicator"></span><div data-xh-part="row-content"><span data-xh-part="row-text">user:guide</span><span data-xh-part="row-description">引导进度</span></div></div>
      <div data-xh-part="row" value="user:welcome"><span data-xh-part="row-selection-indicator"></span><div data-xh-part="row-content"><span data-xh-part="row-text">user:welcome</span><span data-xh-part="row-description">欢迎页状态</span></div></div>
    </div>
  </xh-grid-list>
  <span data-demo-output>详情：<span id="grid-list-action-on-click-detail">（未打开）</span> · 已勾选：<span id="grid-list-action-on-click-checked">（无）</span></span>
</div>
<script type="module">
  const host = document.getElementById("grid-list-action-on-click");
  const detail = document.getElementById("grid-list-action-on-click-detail");
  const checked = document.getElementById("grid-list-action-on-click-checked");
  host.value = [];
  host.addEventListener("value-change", (event) => {
    host.value = event.detail.value;
    checked.textContent = event.detail.value.join("、") || "（无）";
  });
  host.addEventListener("action", (event) => {
    detail.textContent = event.detail.value;
  });
</script>
