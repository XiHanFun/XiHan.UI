<!-- 受控 | 由 value 和 value-change 控制；外部按钮经插槽状态的 setOpen 与 setValue 开合与清空，改值同样经 value-change 回到宿主 -->
<xh-select id="select-controlled" value="banana" open="false" placeholder="请选择">
  <div data-xh-part="root">
    <span data-xh-part="label">水果</span>
    <div data-xh-part="control">
      <button data-xh-part="trigger">
        <span data-xh-part="value-text"></span>
        <span data-xh-part="indicator"></span>
      </button>
    </div>
    <div data-xh-part="positioner">
      <div data-xh-part="content">
        <div data-xh-part="list">
          <div data-xh-part="item" value="apple">
            <span data-xh-part="item-text">苹果</span>
            <span data-xh-part="item-indicator"></span>
          </div>
          <div data-xh-part="item" value="banana">
            <span data-xh-part="item-text">香蕉</span>
            <span data-xh-part="item-indicator"></span>
          </div>
          <div data-xh-part="item" value="cherry">
            <span data-xh-part="item-text">樱桃（选不中）</span>
            <span data-xh-part="item-indicator"></span>
          </div>
        </div>
      </div>
    </div>
    <div style="display: flex; gap: var(--xh-space-2); margin-block-start: var(--xh-space-2)">
      <xh-button variant="outline" size="sm" id="select-controlled-toggle">
        <button data-xh-part="root">展开</button>
      </xh-button>
      <xh-button variant="ghost" size="sm" id="select-controlled-clear">
        <button data-xh-part="root">清空</button>
      </xh-button>
    </div>
  </div>
</xh-select>
<p data-demo-output>宿主持有的值：<span id="select-controlled-value">banana</span></p>

<script type="module">
  // Web Components 没有插槽状态：开合与值都由宿主持有，按钮直接改宿主那一份再写回元素
  const select = document.getElementById("select-controlled");
  const readout = document.getElementById("select-controlled-value");
  const toggle = document.getElementById("select-controlled-toggle");
  const toggleLabel = toggle.querySelector('[data-xh-part="root"]');
  const clear = document.getElementById("select-controlled-clear");

  let open = false;
  let value = ["banana"];
  let rejected = false;

  function apply() {
    select.open = open;
    select.value = value;
    toggleLabel.textContent = open ? "收起" : "展开";
    clear.disabled = value.length === 0;
    readout.textContent = (value.join("、") || "（空）") + (rejected ? " · 上一次选择被拒绝" : "");
  }

  select.addEventListener("open-change", (event) => {
    open = event.detail.open;
    apply();
  });
  // 只有通过校验的值才写回，未写回则界面停在原值
  select.addEventListener("value-change", (event) => {
    rejected = event.detail.value.includes("cherry");
    if (!rejected)
      value = event.detail.value;
    apply();
  });

  toggle.addEventListener("click", () => {
    open = !open;
    apply();
  });
  clear.addEventListener("click", () => {
    rejected = false;
    value = [];
    apply();
  });

  apply();
</script>
