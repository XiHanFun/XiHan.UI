<!-- 滚动加载 | 列表滚到底派发 load-more，宿主取下一页接到 collection 末尾 -->
<xh-select id="select-scroll" label="工单" placeholder="请选择">
  <div data-xh-part="root"></div>
</xh-select>
<p data-demo-output>已加载 <span id="select-scroll-count">20</span> / 80 条</p>

<script type="module">
  const select = document.getElementById("select-scroll");
  const count = document.getElementById("select-scroll-count");
  const PAGE_SIZE = 20;
  const TOTAL = 80;

  function makePage(from) {
    return Array.from({ length: PAGE_SIZE }, (_, i) => ({ value: `no-${from + i + 1}`, label: `第 ${from + i + 1} 号工单` }));
  }

  select.collection = makePage(0);

  // 在途时不会再派发；取完了就不再取
  select.addEventListener("load-more", () => {
    if (select.collection.length >= TOTAL) return;
    select.loading = true;
    window.setTimeout(() => {
      select.collection = [...select.collection, ...makePage(select.collection.length)];
      count.textContent = String(select.collection.length);
      select.loading = false;
    }, 500);
  });
</script>
