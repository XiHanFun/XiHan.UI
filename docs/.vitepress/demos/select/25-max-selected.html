<!-- 限定多选数量 | max-selected=2：选满后其余选项不可再选，点掉一个即腾出名额 -->
<xh-select
  id="select-max-selected"
  multiple
  max-selected="2"
  label="水果（最多两种）"
  placeholder="请选择"
>
  <div data-xh-part="root"></div>
</xh-select>
<p data-demo-output>已选 <span id="select-max-selected-output"></span></p>

<script type="module">
  const select = document.getElementById("select-max-selected");
  const output = document.getElementById("select-max-selected-output");
  const render = (picked) => {
    output.textContent = `${picked.length} / 2：${picked.join("、") || "（无）"}`;
  };

  // 选项与选中集合都是数组，只走属性
  select.collection = [
    { value: "apple", label: "苹果" },
    { value: "banana", label: "香蕉" },
    { value: "blueberry", label: "蓝莓" },
    { value: "durian", label: "榴莲" },
  ];
  select.value = ["apple"];
  render(select.value);

  // 受控：组件发的事件宿主写回才算数
  select.addEventListener("value-change", (event) => {
    select.value = event.detail.value;
    render(event.detail.value);
  });
</script>
