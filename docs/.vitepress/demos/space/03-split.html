<!-- 分隔符 | 每两个子项之间放一份分隔符：Vue 交给 split 插槽自动铺，WC 由作者逐个写在 root 里 -->
<style>
  #space-split [data-link] {
    color: var(--xh-fg-brand);
    cursor: pointer;
  }
  /* 分隔符部件自带 aria-hidden，这里只画那条线；display: block 让它吃得住尺寸 */
  #space-split [data-rule] {
    display: block;
    inline-size: 1px;
    block-size: 1em;
    background: var(--xh-border-default);
  }
</style>

<!-- 宿主设 display: contents，排布落在 root 上 -->
<xh-space id="space-split" gap="sm" style="display: contents">
  <div data-xh-part="root">
    <span data-link>编辑</span>
    <span data-xh-part="split"><span data-rule></span></span>
    <span data-link>复制</span>
    <span data-xh-part="split"><span data-rule></span></span>
    <span data-link>归档</span>
    <span data-xh-part="split"><span data-rule></span></span>
    <span data-link>删除</span>
  </div>
</xh-space>
