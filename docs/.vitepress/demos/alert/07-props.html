<!-- props 写法 | 不写结构时按标准结构铺：标题与说明两个属性写出一条提示，图标与操作用同名插槽 -->
<div style="width: 100%; display: grid; gap: 12px">
  <xh-alert title-text="部署已排队" description="构建完成后会自动发布。"></xh-alert>

  <xh-alert tone="success" title-text="发布完成" description="三个节点都已切到新版本。">
    <span slot="indicator"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5L9.5 18L20 6"/></svg></span>
    <xh-button slot="action" size="sm" variant="outline">
      <button data-xh-part="root">查看详情</button>
    </xh-button>
  </xh-alert>
</div>
