<!-- 勾选与选中分开 | checkable 让勾选与选中各管一件事：行首勾选框与空格只改勾选集合（批量操作），点行与确认键选中当前项（看详情）；级联作用在勾选集合上 -->
<div style="display: grid; gap: 8px; justify-items: start">
  <xh-tree id="tree-check-detail" label="缓存键" checkable cascade></xh-tree>
  <p data-demo-output>
    详情：<span id="tree-check-detail-current">identity:guide</span> · 已勾选：<span id="tree-check-detail-checked">（无）</span>
  </p>
</div>

<script type="module">
  const tree = document.getElementById("tree-check-detail");
  const current = document.getElementById("tree-check-detail-current");
  const checked = document.getElementById("tree-check-detail-checked");

  tree.collection = [
    {
      value: "identity",
      label: "identity",
      children: [
        { value: "identity:global", label: "global" },
        { value: "identity:guide", label: "guide" },
        { value: "identity:welcome", label: "welcome" },
      ],
    },
    {
      value: "security",
      label: "security",
      children: [
        { value: "security:rules", label: "rules" },
        { value: "security:policies", label: "policies" },
      ],
    },
  ];

  tree.expandedValue = ["identity", "security"];
  tree.addEventListener(
    "expanded-value-change",
    (event) => (tree.expandedValue = event.detail.value),
  );

  tree.selection = ["identity:guide"];
  tree.addEventListener("selection-change", (event) => {
    tree.selection = event.detail.value;
    current.textContent = event.detail.value[0] ?? "（未选）";
  });

  tree.checked = [];
  tree.addEventListener("checked-change", (event) => {
    tree.checked = event.detail.value;
    checked.textContent = event.detail.value.join("、") || "（无）";
  });
</script>
