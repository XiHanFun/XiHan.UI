<!-- 滑块中的内容 | thumb 是一个普通容器，放置什么由作者决定，容纳空间依靠 --xh-slider-thumb-size 撑开直径；value-text 挂在 thumb 中即随之移动，推动时由皮肤显示成值气泡，文字取自作者的格式化函数 -->
<div style="display: flex; flex-direction: column; gap: var(--xh-space-8)">
  <xh-slider id="slider-thumb-content" default-value="45" step="5">
    <div
      data-xh-part="root"
      style="inline-size: 320px; --xh-slider-thumb-size: 34px"
    >
      <label data-xh-part="label">完成度</label>
      <div data-xh-part="control">
        <div data-xh-part="track">
          <div data-xh-part="range"></div>
        </div>
        <div data-xh-part="thumb">
          <span
            id="slider-thumb-content-badge"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              block-size: 100%;
              font-size: 11px;
              color: var(--xh-fg-on-brand);
            "
          >
            45%
          </span>
          <input data-xh-part="hidden-input" />
        </div>
      </div>
    </div>
  </xh-slider>

  <xh-slider
    id="slider-budget"
    default-value="1800"
    min="0"
    max="5000"
    step="50"
    name="budget"
  >
    <div data-xh-part="root" style="inline-size: 320px; --xh-slider-gap: var(--xh-space-8)">
      <label data-xh-part="label">
        预算上限：<span id="slider-budget-label">¥1,800</span>
      </label>
      <div data-xh-part="control">
        <div data-xh-part="track">
          <div data-xh-part="range"></div>
        </div>
        <div data-xh-part="thumb">
          <span data-xh-part="value-text"></span>
          <input data-xh-part="hidden-input" />
        </div>
      </div>
    </div>
  </xh-slider>
  <p data-demo-output>已选：<span id="slider-budget-value">¥1,800</span></p>
</div>

<script type="module">
  // 滑块里的数字跟着值走
  const thumbSlider = document.getElementById("slider-thumb-content");
  const badge = document.getElementById("slider-thumb-content-badge");
  thumbSlider.addEventListener("value-change", (event) => {
    badge.textContent = `${event.detail.value[0]}%`;
  });

  const budgetSlider = document.getElementById("slider-budget");
  const label = document.getElementById("slider-budget-label");
  const readout = document.getElementById("slider-budget-value");

  const money = (value) => `¥${value.toLocaleString("zh-CN")}`;

  // 读屏走 aria-valuetext，气泡里的文字也取同一个格式化函数
  budgetSlider.getValueText = ({ value }) => money(value);

  budgetSlider.addEventListener("value-change", (event) => {
    label.textContent = money(event.detail.value[0]);
    readout.textContent = label.textContent;
  });
</script>
