<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XiHan.UI · Web Components</title>
    <style>
      body { margin: 0; background: var(--xh-bg-canvas); color: var(--xh-fg-default); font-family: system-ui, sans-serif; }
      .wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 80px; display: grid; gap: 28px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      h1 { font-size: 22px; margin: 0; }
      h2 { font-size: 15px; margin: 0 0 12px; color: var(--xh-fg-muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .lead { color: var(--xh-fg-muted); font-size: 14px; line-height: 1.6; margin: 0 0 12px; }
      code { background: var(--xh-bg-subtle); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .row.end { justify-content: flex-end; margin-block-start: 12px; }
      section { border: 1px solid var(--xh-border-subtle); border-radius: 10px; padding: 20px; background: var(--xh-bg-surface); }
      #theme { border: 1px solid var(--xh-border-default); background: var(--xh-bg-subtle); color: var(--xh-fg-default); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
      /* 视觉层示例 */
      .v-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
      .v-tile { display: grid; gap: 6px; padding: 0; border: 1px solid var(--xh-border-subtle); border-radius: 8px; background: none; color: inherit; cursor: pointer; overflow: hidden; font: inherit; text-align: left; }
      .v-tile[aria-pressed='true'] { border-color: var(--xh-border-default); outline: 2px solid var(--xh-fg-default); outline-offset: 1px; }
      .v-tile-canvas { aspect-ratio: 16 / 9; width: 100%; }
      .v-tile-name { font-size: 11px; letter-spacing: 0.04em; padding: 0 8px 7px; color: var(--xh-fg-muted); }
      .v-stage { aspect-ratio: 21 / 8; width: 100%; border-radius: 10px; overflow: hidden; }
      .v-caption { position: absolute; inset-block-end: 12px; inset-inline-start: 14px; display: grid; gap: 2px; color: #fff; text-shadow: 0 1px 10px rgb(0 0 0 / 55%); font-size: 12px; }
      .v-caption strong { font-size: 15px; }
      .v-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 16px; margin-block-start: 16px; }
      .v-control { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; font-size: 12px; }
      .v-control-label { color: var(--xh-fg-muted); }
      .v-control input[type='range'] { grid-column: 1 / -1; width: 100%; }
      .v-control output { font-family: ui-monospace, monospace; font-size: 11px; color: var(--xh-fg-muted); }
      .v-btn, .v-input { border: 1px solid var(--xh-border-default); background: var(--xh-bg-subtle); color: var(--xh-fg-default); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
      .v-input { cursor: text; }
      .v-file { border: 1px dashed var(--xh-border-default); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; color: var(--xh-fg-muted); }
      .v-file input { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
